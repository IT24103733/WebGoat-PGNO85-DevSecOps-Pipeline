services:
  webgoat:
    image: webgoat/webgoat:local
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - WEBGOAT_HOST=0.0.0.0
      - WEBWOLF_HOST=0.0.0.0
      - WEBGOAT_PORT=8080
      - WEBWOLF_PORT=9090
      - JAVA_TOOL_OPTIONS=-Djava.net.preferIPv4Stack=true
    networks:
      - app-network

  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - webgoat
    networks:
      - app-network
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

networks:
  app-network:
    driver: bridge