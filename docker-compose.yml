version: '3.8'

services:

  webgoat:
    build:
      context: .
      dockerfile: Dockerfile
    ports: 
      - "8080:8080"
      - "9090:9090"
    environment:
      - TZ=Asia/Colombo
    networks:
      - interconnect


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      - webgoat
    networks:
      - interconnect

networks:
  interconnect:
    driver: bridge



